# Firebase App Hosting (deploys from GitHub via Firebase Studio / console).
# The Supabase URL and publishable key are public by design (RLS guards data).
# Server-only secrets (Phase 3+) go in Cloud Secret Manager:
#   firebase apphosting:secrets:set SUPABASE_SERVICE_ROLE_KEY
# and are referenced below with `secret:` instead of `value:`.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://sciivzgingzpxxqihrkh.supabase.co
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    value: sb_publishable_wEaDbmii9eNgDxyUsLf-ug_3tIlDbDk
    availability: [BUILD, RUNTIME]
  # Public URL used for sign-in redirects (update if a custom domain is added).
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ht-land--proptrack-cb719.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
  # Google Maps browser key for the in-app photorealistic 3D view. Kept in Secret
  # Manager (not git): firebase apphosting:secrets:set GOOGLE_MAPS_API_KEY
  # Restrict it in Google Cloud to this site's URL and to the Maps JavaScript +
  # Map Tiles APIs. Uncomment once the secret exists (a missing secret fails the build).
  # - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
  #   secret: GOOGLE_MAPS_API_KEY
  #   availability: [BUILD, RUNTIME]
  # - variable: SUPABASE_SERVICE_ROLE_KEY
  #   secret: SUPABASE_SERVICE_ROLE_KEY
